name: Sync Profile to Gitee & GitCode

on:
  workflow_dispatch: {}

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  profile-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync profile fields (bio/blog)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          BIO='思维接触网百科 itswe.com 站长｜开源接触网计算工具｜ITSWE-Nav 导航作者'
          BLOG='https://www.itswe.com'
          printf '{"bio":"%s","blog":"%s"}' "$BIO" "$BLOG" > body.json
          echo "=== Gitee PATCH /user ==="
          curl -s -X PATCH "https://gitee.com/api/v5/user" -H "Authorization: Bearer $GITEE_TOKEN" --data-urlencode "bio=$BIO" --data-urlencode "blog=$BLOG" -o gitee_resp.json -w "http=%{http_code}" || true
          head -c 300 gitee_resp.json; echo
          echo "=== GitCode PATCH /user ==="
          curl -s -X PATCH "https://gitcode.com/api/v5/user" -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H "Content-Type: application/json" -d @body.json -o gitcode_resp.json -w "http=%{http_code}" || true
          head -c 300 gitcode_resp.json; echo
          echo "=== 复核公开资料 ==="
          curl -s "https://gitee.com/api/v5/users/showhoo" | head -c 400; echo
          curl -s "https://gitcode.com/api/v5/users/showhoo" | head -c 400; echo
