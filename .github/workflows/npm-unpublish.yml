name: npm-unpublish-031

on:
  push:
    branches: [main]
    paths: ['.github/workflows/npm-unpublish.yml']

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: unpublish 0.3.1 (含错值，撤回重发)
        run: npm unpublish ocs-calculators@0.3.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
