name: Mirror All Repos to Gitee & GitCode

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 09:00 北京时间自动全量对齐
  workflow_dispatch: {}    # 支持手动触发

concurrency:
  group: mirror-all
  cancel-in-progress: false

jobs:
  mirror-all:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and mirror all repos
        env:
          GH_PAT: ${{ secrets.MIRROR_PAT }}        # 经典令牌，需 repo 权限（读私有仓库列表）
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITEE_USER: showhoo
          GITCODE_USER: showhoo
        run: |
          set -e
          echo "=== 发现 GitHub 账号下所有仓库 ==="
          REPOS=$(curl -s -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/user/repos?per_page=100&sort=full_name&type=owner" \
            | jq -r '.[] | "\(.name)|\(.private)|\(.description // "")"')
          echo "$REPOS"

          while IFS='|' read -r name private desc; do
            [ -z "$name" ] && continue
            echo ""
            echo "=== 同步 $name (private=$private) ==="

            if [ "$private" = "true" ]; then VIS="private"; else VIS="public"; fi

            # ---- Gitee: 不存在则建仓 ----
            GITEE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              "https://gitee.com/api/v5/repos/${GITEE_USER}/${name}")
            if [ "$GITEE_CODE" = "404" ]; then
              echo "  Gitee 建仓 $name ..."
              curl -s -o /dev/null -X POST -H "Authorization: Bearer $GITEE_TOKEN" \
                "https://gitee.com/api/v5/user/repos" \
                -d "name=${name}&private=$([[ $VIS == private ]] && echo true || echo false)&description=${desc}"
            fi

            # ---- GitCode: 不存在则建仓 ----
            GITCODE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              "https://gitcode.com/api/v5/repos/${GITCODE_USER}/${name}")
            if [ "$GITCODE_CODE" = "404" ]; then
              echo "  GitCode 建仓 $name ..."
              curl -s -o /dev/null -X POST -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
                -H "Content-Type: application/json" \
                "https://gitcode.com/api/v5/user/repos" \
                -d "{\"name\":\"${name}\",\"private\":$([[ $VIS == private ]] && echo true || echo false),\"description\":\"${desc}\"}"
            fi

            # ---- 镜像推送（裸镜像：分支+标签全量）----
            git clone --mirror "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/${name}.git" "mirror_${name}.git"
            cd "mirror_${name}.git"
            git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${name}.git" || true
            git remote add gitcode "https://${GITCODE_USER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_USER}/${name}.git" || true
            git push gitee --all --force
            git push gitee --tags --force
            git push gitcode --all --force
            git push gitcode --tags --force

            # ---- Tag 对账：删除远端有、GitHub 已没有的幽灵 tag ----
            # （git push --tags 只推本地有的，从不删除远端多余 tag，被删版本的 tag 会永久残留）
            for plat in gitee gitcode; do
              git ls-remote --tags "$plat" 2>/dev/null | grep 'refs/tags/' | grep -v '\^{}' \
                | awk -F'refs/tags/' '{print $2}' | while read -r rt; do
                  [ -z "$rt" ] && continue
                  if ! git rev-parse -q --verify "refs/tags/$rt" >/dev/null 2>&1; then
                    echo "  [$plat] 删除幽灵 tag $rt"
                    git push "$plat" ":refs/tags/$rt" >/dev/null 2>&1 || echo "  [$plat] 删除 $rt 失败（忽略）"
                  fi
                done
            done
            cd ..
            rm -rf "mirror_${name}.git"

            # ---- 元数据对齐：简介 + 公私有可见性（每天 PATCH，与 GitHub 对齐）----
            # Gitee PATCH 的 name 必填；可见性一并同步，防止平台侧被改私有后失配
            if [ -n "$desc" ]; then
              META=$(jq -n --arg name "$name" --arg desc "$desc" --argjson priv "$private" \
                '{name:$name, description:$desc, private:$priv}')
              GC=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
                -H "Authorization: Bearer $GITEE_TOKEN" -H "Content-Type: application/json" \
                -d "$META" "https://gitee.com/api/v5/repos/${GITEE_USER}/${name}")
              KC=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
                -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H "Content-Type: application/json" \
                -d "$META" "https://gitcode.com/api/v5/repos/${GITCODE_USER}/${name}")
              echo "  ↺ 元数据对齐(简介+可见性): gitee=$GC gitcode=$KC"
            fi

            # ---- 发行版同步：GitHub Releases → 平台发行版（只补缺创建）----
            GHREL=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${name}/releases?per_page=100")
            for plat in gitee gitcode; do
              if [ "$plat" = "gitee" ]; then
                AUTHH="Authorization: Bearer $GITEE_TOKEN"; PUSER="$GITEE_USER"
              else
                AUTHH="PRIVATE-TOKEN: $GITCODE_TOKEN"; PUSER="$GITCODE_USER"
              fi
              EXISTING=$(curl -s -H "$AUTHH" \
                "https://${plat}.com/api/v5/repos/${PUSER}/${name}/releases?per_page=100" \
                | jq -r '.[].tag_name' 2>/dev/null || true)
              echo "$GHREL" | jq -c '.[] | select(.draft == false)' 2>/dev/null | while read -r rel; do
                [ -z "$rel" ] && continue
                RTAG=$(echo "$rel" | jq -r '.tag_name')
                echo "$EXISTING" | grep -qx "$RTAG" && continue
                RNAME=$(echo "$rel" | jq -r '.name // .tag_name')
                RBODY=$(echo "$rel" | jq -r '.body // ""')
                PRE=$(echo "$rel" | jq -r '.prerelease')
                RJ=$(jq -n --arg tag "$RTAG" --arg nm "$RNAME" --arg bd "$RBODY" --argjson pre "$PRE" \
                  '{tag_name:$tag, name:$nm, body:$bd, prerelease:$pre}')
                RC=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  -H "$AUTHH" -H "Content-Type: application/json" \
                  -d "$RJ" "https://${plat}.com/api/v5/repos/${PUSER}/${name}/releases")
                echo "  [$plat] 发行版 $RTAG 创建: $RC"
              done
            done

            echo "  ✅ $name 同步完成"
          done <<< "$REPOS"

          echo ""
          echo "=== 全部仓库镜像完成 ==="
