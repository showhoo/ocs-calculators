name: 计算结果或公式问题
description: 报告某个计算器的结果偏差、公式错误或参数取值问题
title: '[计算问题] '
labels: ['calculation']
body:
  - type: markdown
    value: |
      感谢反馈。公式与参数问题是本项目最有价值的 issue，请尽量提供可复现的信息。

  - type: dropdown
    id: module
    attributes:
      label: 涉及的计算器
      options:
        - tension（张力-温度安装曲线）
        - force（弓网接触力评价）
        - ampacity（载流量与热稳定）
        - dropper（吊弦长度计算）
        - wind（风偏移计算）
        - wear（接触线磨耗计算）
        - copper（铜材计算）
        - stroke（补偿行程计算）
        - wavespeed（波速利用率计算）
        - voltage-drop（电压降校核）
        - curve-stagger（曲线拉出值校核）
        - icing（覆冰荷载校核）
        - 其他 / 线材参数
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: 输入参数
      description: 请列出你输入的所有参数值（含单位）
      placeholder: |
        线材：CTHM-120
        E = 120 GPa
        A = 120 mm²
        α = 1.7e-5 /℃
        跨距 l = 55 m
        基准 T₁ = 20 kN @ t₁ = -20 ℃
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确的结果是多少？依据是什么（标准号、设计手册、手算过程）？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 本库或在线计算器给出的结果
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我确认输入参数在 meta.scope 标注的适用范围内
        - label: 我已阅读 DISCLAIMER.md，理解本库结果仅供参考

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考文献链接、你认为可能的原因等
